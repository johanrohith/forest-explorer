<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Forest Explorer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07120b;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 7px #000}
.pill{position:absolute;top:14px;padding:10px 14px;border:1px solid #ffffff28;border-radius:999px;background:#102218bb;backdrop-filter:blur(10px);font-weight:700;letter-spacing:.06em}
.title{left:14px}
.time{right:14px}
.tip{left:50%;top:14px;transform:translateX(-50%);font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff9}
.controls{position:fixed;inset:0;pointer-events:none}
.joy{position:absolute;left:18px;bottom:18px;width:166px;height:166px;border-radius:50%;border:1px solid #ffffff35;background:#ffffff0c;box-shadow:inset 0 0 25px #0003;pointer-events:auto;touch-action:none}
.joy:after{content:"";position:absolute;inset:25px;border:1px solid #ffffff18;border-radius:50%;pointer-events:none}
.knob{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff55,#ffffff18 52%,#00000025);border:1px solid #ffffff45;box-shadow:0 7px 20px #0006;transform:translate3d(0,0,0)}
.help{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:8px 12px;border-radius:10px;background:#07120bcc;border:1px solid #ffffff20;font-size:11px;opacity:.8}
@media(max-width:600px){
  .joy{width:154px;height:154px;bottom:16px;left:14px}
  .knob{width:64px;height:64px;margin:-32px}
  .pill{top:10px;font-size:11px;padding:8px 10px}
  .tip{top:50px;font-size:11px}
  .help{display:none}
}
</style>
</head>
<body>
<div id="game"></div>

<div class="hud">
  <div class="pill title">🌲 FOREST EXPLORER</div>
  <div class="pill time" id="time">☀️ DAYLIGHT</div>
  <div class="pill tip" id="tip">JOYSTICK TO WALK • DRAG TO LOOK</div>
  <div class="cross"></div>
  <div class="help">WASD / ARROW KEYS TO MOVE • DRAG TO LOOK</div>
</div>

<div class="controls">
  <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  "use strict";

  const mount = document.getElementById("game");
  const timeEl = document.getElementById("time");
  const tipEl = document.getElementById("tip");

  if (!window.THREE) {
    mount.innerHTML = '<div style="height:100%;display:grid;place-items:center;color:white;padding:30px;text-align:center">Three.js could not load.<br>Please check the internet connection and reload.</div>';
    return;
  }

  const THREE = window.THREE;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fb6c4);
  scene.fog = new THREE.FogExp2(0x78998b, 0.0085);

  const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 380);
  camera.rotation.order = "YXZ";

  const renderer = new THREE.WebGLRenderer({
    antialias: innerWidth > 700,
    powerPreference: "high-performance"
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, innerWidth <= 700 ? 1.12 : 1.45));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = true;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  mount.appendChild(renderer.domElement);

  const clock = new THREE.Clock();
  let elapsed = 0;

  const WORLD = 150;
  const PLAYER_HEIGHT = 1.65;
  const player = {
    x: 0,
    z: 7,
    yaw: Math.PI,
    pitch: -0.04,
    speed: 4.8,
    bob: 0
  };

  const keys = { forward: false, back: false, left: false, right: false };
  const joyState = { x: 0, y: 0 };
  const temp = {
    forward: new THREE.Vector3(),
    right: new THREE.Vector3(),
    move: new THREE.Vector3()
  };

  function hash(x, z) {
    const n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123;
    return n - Math.floor(n);
  }

  function valueNoise(x, z) {
    const x0 = Math.floor(x), z0 = Math.floor(z);
    const xf = x - x0, zf = z - z0;
    const u = xf * xf * (3 - 2 * xf);
    const v = zf * zf * (3 - 2 * zf);
    const a = hash(x0, z0);
    const b = hash(x0 + 1, z0);
    const c = hash(x0, z0 + 1);
    const d = hash(x0 + 1, z0 + 1);
    return THREE.MathUtils.lerp(
      THREE.MathUtils.lerp(a, b, u),
      THREE.MathUtils.lerp(c, d, u),
      v
    );
  }

  function terrainHeight(x, z) {
    const broad = (valueNoise(x * 0.055, z * 0.055) - 0.5) * 1.1;
    const detail = (valueNoise(x * 0.15, z * 0.15) - 0.5) * 0.28;
    return broad + detail;
  }

  function makeGroundTexture() {
    const c = document.createElement("canvas");
    c.width = c.height = 512;
    const g = c.getContext("2d");
    const img = g.createImageData(c.width, c.height);

    for (let y = 0; y < c.height; y++) {
      for (let x = 0; x < c.width; x++) {
        const n = valueNoise(x * 0.018, y * 0.018) * 0.72
                + valueNoise(x * 0.06, y * 0.06) * 0.28;
        const i = (y * c.width + x) * 4;
        img.data[i] = 34 + n * 28;
        img.data[i + 1] = 54 + n * 42;
        img.data[i + 2] = 29 + n * 18;
        img.data[i + 3] = 255;
      }
    }

    g.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(7, 7);
    return tex;
  }

  // Ground
  const groundGeo = new THREE.PlaneGeometry(WORLD, WORLD, 100, 100);
  groundGeo.rotateX(-Math.PI / 2);
  const p = groundGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, terrainHeight(x, z));
  }
  groundGeo.computeVertexNormals();

  const ground = new THREE.Mesh(
    groundGeo,
    new THREE.MeshStandardMaterial({
      map: makeGroundTexture(),
      roughness: 1
    })
  );
  ground.receiveShadow = true;
  scene.add(ground);

  // Sky gradient
  const skyGeo = new THREE.SphereGeometry(220, 24, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      top: { value: new THREE.Color(0x5f8fa8) },
      mid: { value: new THREE.Color(0xa7c3c4) },
      bottom: { value: new THREE.Color(0xd8d9c6) }
    },
    vertexShader: `
      varying vec3 v;
      void main(){
        v = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader: `
      varying vec3 v;
      uniform vec3 top, mid, bottom;
      void main(){
        float h = clamp(v.y * .5 + .5, 0.0, 1.0);
        vec3 c = mix(bottom, mid, smoothstep(0.0,.55,h));
        c = mix(c, top, smoothstep(.45,1.0,h));
        gl_FragColor = vec4(c,1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // Lighting
  const hemi = new THREE.HemisphereLight(0xbdd7e2, 0x26371f, 1.65);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffe5b8, 3.7);
  sun.position.set(-45, 65, 25);
  sun.castShadow = true;
  sun.shadow.mapSize.set(innerWidth <= 700 ? 512 : 1024, innerWidth <= 700 ? 512 : 1024);
  sun.shadow.camera.left = -65;
  sun.shadow.camera.right = 65;
  sun.shadow.camera.top = 65;
  sun.shadow.camera.bottom = -65;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 150;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.03;
  scene.add(sun);

  const fill = new THREE.DirectionalLight(0x9fc7e9, 0.45);
  fill.position.set(35, 25, -40);
  scene.add(fill);
  // Materials
  const trunkMat = new THREE.MeshStandardMaterial({ color:0x4b2b1b, roughness:1 });
  const branchMat = new THREE.MeshStandardMaterial({ color:0x2c1b12, roughness:1 });
  const leafMats = [0x1d542b,0x286b35,0x347d3d,0x174523].map(
    c => new THREE.MeshStandardMaterial({
      color:c,
      roughness:.95,
      flatShading:true
    })
  );

  function addTree(x, z, scale, variant) {
    const g = new THREE.Group();
    g.position.set(x, terrainHeight(x,z), z);
    g.scale.setScalar(scale);

    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(.24,.40,4.8,8),
      trunkMat
    );
    trunk.position.y = 2.4;
    trunk.castShadow = true;
    g.add(trunk);

    // Small branch forks
    for (let b = 0; b < 3; b++) {
      const branch = new THREE.Mesh(
        new THREE.CylinderGeometry(.055,.10,1.35,6),
        branchMat
      );
      const side = b - 1;
      branch.position.set(side*.34, 2.75 + (b%2)*.25, 0);
      branch.rotation.z = -side*.48;
      branch.rotation.x = (b-1)*.12;
      branch.castShadow = true;
      g.add(branch);
    }

    // Dense, unmistakable foliage.
    const foliage = [
      {r:1.65,y:3.00,h:2.25},
      {r:1.42,y:4.05,h:2.00},
      {r:1.15,y:4.95,h:1.75},
      {r:.78,y:5.75,h:1.35}
    ];

    foliage.forEach((f,i) => {
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(f.r, f.h, 8, 1),
        leafMats[(variant+i)%leafMats.length]
      );
      cone.position.y = f.y;
      cone.castShadow = true;
      cone.receiveShadow = true;
      g.add(cone);
    });

    scene.add(g);
  }

  // Deterministic forest: avoids the player spawn area.

  for (let i = 0; i < 175; i++) {
    const a = hash(i, 20) * Math.PI * 2;
    const r = 10 + hash(i, 21) * 62;
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    addTree(x, z, .72 + hash(i,22) * 1.05, i % 4);
  }

  // Bushes
  const bushMats = [0x356a3a,0x467b42,0x285a31].map(
    c => new THREE.MeshStandardMaterial({ color:c, roughness:1, flatShading:true })
  );
  for (let i = 0; i < 100; i++) {
    const a = hash(i,30) * Math.PI * 2;
    const r = 7 + hash(i,31) * 66;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const g = new THREE.Group();
    g.position.set(x, terrainHeight(x,z), z);

    for (let j = 0; j < 3; j++) {
      const m = new THREE.Mesh(
        new THREE.IcosahedronGeometry(.35 + hash(i,j+40)*.35, 1),
        bushMats[(i+j)%3]
      );
      m.position.set((hash(i,j+50)-.5)*1.3, .35+hash(i,j+60)*.35, (hash(i,j+70)-.5)*1.3);
      m.scale.y = .7;
      m.castShadow = false;
      g.add(m);
    }
    scene.add(g);
  }

  // Rocks
  const rockMat = new THREE.MeshStandardMaterial({ color:0x59615d, roughness:1, flatShading:true });
  for (let i = 0; i < 70; i++) {
    const a = hash(i,80) * Math.PI * 2;
    const r = 8 + hash(i,81) * 68;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const g = new THREE.Group();
    g.position.set(x, terrainHeight(x,z), z);
    g.rotation.y = hash(i,82) * Math.PI * 2;

    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(.45 + hash(i,83)*.7, 1), rockMat);
    m.scale.set(1.25, .65 + hash(i,84)*.45, 1);
    m.castShadow = true;
    m.receiveShadow = true;
    g.add(m);
    scene.add(g);
  }


  // Sparse fallen-leaf patches for a more natural forest floor.
  const leafPatchMats = [0x5a642d,0x68743a,0x7b6732].map(
    c => new THREE.MeshStandardMaterial({
      color:c, roughness:1, side:THREE.DoubleSide, depthWrite:false
    })
  );
  for (let i = 0; i < 55; i++) {
    const a = hash(i,100) * Math.PI * 2;
    const r = 7 + hash(i,101) * 66;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const patch = new THREE.Mesh(
      new THREE.CircleGeometry(.45 + hash(i,102)*.75, 7),
      leafPatchMats[i % leafPatchMats.length]
    );
    patch.rotation.x = -Math.PI/2;
    patch.rotation.z = hash(i,103)*Math.PI;
    patch.position.set(x, terrainHeight(x,z)+.014, z);
    scene.add(patch);
  }

  // Simple worn paths
  const pathMat = new THREE.MeshStandardMaterial({
    color:0x47392d, transparent:true, opacity:.45, roughness:1, depthWrite:false
  });
  for (let i = 0; i < 35; i++) {
    const a = hash(i,90) * Math.PI * 2;
    const r = 10 + hash(i,91) * 58;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const patch = new THREE.Mesh(new THREE.CircleGeometry(1.2+hash(i,92)*2.4, 12), pathMat);
    patch.rotation.x = -Math.PI/2;
    patch.scale.y = .55;
    patch.position.set(x, terrainHeight(x,z)+.012, z);
    scene.add(patch);
  }


  // A few fallen branches/logs add depth without adding many draw calls.
  const logMat = new THREE.MeshStandardMaterial({
    color:0x4a2c1c, roughness:1, flatShading:true
  });
  for (let i = 0; i < 10; i++) {
    const a = hash(i,120) * Math.PI * 2;
    const r = 14 + hash(i,121) * 58;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const log = new THREE.Mesh(
      new THREE.CylinderGeometry(.13,.18,2.4+hash(i,122)*1.8,7),
      logMat
    );
    log.position.set(x, terrainHeight(x,z)+.16, z);
    log.rotation.z = Math.PI/2 + (hash(i,123)-.5)*.25;
    log.rotation.y = hash(i,124)*Math.PI;
    log.castShadow = false;
    scene.add(log);
  }

  // First-person hand view.
  // This is attached directly to the camera and uses Basic materials + renderOrder
  // so it remains visible on mobile regardless of forest lighting/shadows.
  const skinView = new THREE.MeshBasicMaterial({
    color: 0xc88461,
    depthTest: false,
    depthWrite: false
  });
  const skinShadowView = new THREE.MeshBasicMaterial({
    color: 0xa9654c,
    depthTest: false,
    depthWrite: false
  });
  const sleeveView = new THREE.MeshBasicMaterial({
    color: 0x26352b,
    depthTest: false,
    depthWrite: false
  });

  const arm = new THREE.Group();
  arm.position.set(.48, -.34, -.88);
  arm.rotation.set(-.08, -.12, -.10);
  arm.renderOrder = 1000;
  camera.add(arm);

  // Sleeve / wrist
  const sleeve = new THREE.Mesh(
    new THREE.CylinderGeometry(.145,.13,.34,8),
    sleeveView
  );
  sleeve.rotation.z = -.18;
  sleeve.position.set(.02,-.23,.02);
  sleeve.renderOrder = 1000;
  arm.add(sleeve);

  // Forearm
  const forearmView = new THREE.Mesh(
    new THREE.CapsuleGeometry(.115,.52,5,8),
    skinView
  );
  forearmView.rotation.z = -.18;
  forearmView.position.set(.01,-.02,0);
  forearmView.renderOrder = 1000;
  arm.add(forearmView);

  // Palm
  const palmView = new THREE.Mesh(
    new THREE.SphereGeometry(.17,10,8),
    skinView
  );
  palmView.scale.set(.9,1.22,.62);
  palmView.position.set(.00,.29,-.01);
  palmView.rotation.z = -.08;
  palmView.renderOrder = 1000;
  arm.add(palmView);

  // Fingers
  for(let i=0;i<4;i++){
    const finger = new THREE.Mesh(
      new THREE.CapsuleGeometry(.032,.15,4,7),
      skinShadowView
    );
    finger.position.set(-.075+i*.05,.45,-.055);
    finger.rotation.z = -.10+(i-1.5)*.035;
    finger.rotation.x = -.35;
    finger.renderOrder = 1001;
    arm.add(finger);
  }

  // Thumb
  const thumbView = new THREE.Mesh(
    new THREE.CapsuleGeometry(.034,.18,4,7),
    skinView
  );
  thumbView.position.set(-.13,.29,-.02);
  thumbView.rotation.z = -.62;
  thumbView.rotation.y = .22;
  thumbView.renderOrder = 1001;
  arm.add(thumbView);

  // Force the first-person model to render even if the camera clips the forest.
  arm.traverse(o => {
    if(o.isMesh){
      o.frustumCulled = false;
      o.renderOrder = 1000;
    }
  });

  // Input
  const joy = document.getElementById("joy");
  const knob = document.getElementById("knob");
  let joyId = null;

  function setJoy(clientX, clientY) {
    const r = joy.getBoundingClientRect();
    let dx = clientX - (r.left + r.width/2);
    let dy = clientY - (r.top + r.height/2);
    const max = r.width * .36;
    const len = Math.hypot(dx,dy);
    if (len > max) {
      dx = dx / len * max;
      dy = dy / len * max;
    }
    knob.style.transform = `translate3d(${dx}px,${dy}px,0)`;
    joyState.x = dx/max;
    joyState.y = dy/max;
  }

  function endJoy(e) {
    if (e.pointerId !== joyId) return;
    joyId = null;
    joyState.x = 0;
    joyState.y = 0;
    knob.style.transform = "translate3d(0,0,0)";
  }

  joy.addEventListener("pointerdown", e => {
    e.preventDefault();
    e.stopPropagation();
    joyId = e.pointerId;
    try { joy.setPointerCapture(joyId); } catch (_) {}
    setJoy(e.clientX,e.clientY);
  }, {passive:false});

  joy.addEventListener("pointermove", e => {
    if (e.pointerId !== joyId) return;
    e.preventDefault();
    setJoy(e.clientX,e.clientY);
  }, {passive:false});

  ["pointerup","pointercancel","lostpointercapture"].forEach(t => joy.addEventListener(t,endJoy));

  function setKey(code, down) {
    if (code === "KeyW" || code === "ArrowUp") keys.forward = down;
    if (code === "KeyS" || code === "ArrowDown") keys.back = down;
    if (code === "KeyA" || code === "ArrowLeft") keys.left = down;
    if (code === "KeyD" || code === "ArrowRight") keys.right = down;
  }

  addEventListener("keydown", e => {
    setKey(e.code,true);
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  }, {passive:false});

  addEventListener("keyup", e => setKey(e.code,false));

  // Touch/mouse look: drag anywhere except joystick.
  let lookId = null, lastX = 0, lastY = 0;

  function inJoystickArea(x,y) {
    const r = joy.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  renderer.domElement.addEventListener("pointerdown", e => {
    if (inJoystickArea(e.clientX,e.clientY)) return;
    lookId = e.pointerId;
    lastX = e.clientX;
    lastY = e.clientY;
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  }, {passive:false});

  renderer.domElement.addEventListener("pointermove", e => {
    if (e.pointerId !== lookId) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    player.yaw -= dx * .0045;
    player.pitch -= dy * .003;
    player.pitch = THREE.MathUtils.clamp(player.pitch,-1.2,1.2);
    e.preventDefault();
  }, {passive:false});

  ["pointerup","pointercancel","lostpointercapture"].forEach(t =>
    renderer.domElement.addEventListener(t, e => {
      if (e.pointerId === lookId) lookId = null;
    })
  );

  // Movement and game loop
  function update(dt) {
    let forwardInput = Number(keys.forward) - Number(keys.back);
    let strafeInput = Number(keys.right) - Number(keys.left);

    if (Math.abs(joyState.y) > .04 || Math.abs(joyState.x) > .04) {
      forwardInput = -joyState.y;
      strafeInput = joyState.x;
    }

    temp.forward.set(Math.sin(player.yaw),0,Math.cos(player.yaw));
    temp.right.set(Math.cos(player.yaw),0,-Math.sin(player.yaw));
    temp.move.set(0,0,0)
      .addScaledVector(temp.forward,-forwardInput)
      .addScaledVector(temp.right,strafeInput);

    const moving = temp.move.lengthSq() > .001;
    if (moving) {
      temp.move.normalize();
      player.x += temp.move.x * player.speed * dt;
      player.z += temp.move.z * player.speed * dt;

      const limit = WORLD * .47;
      player.x = THREE.MathUtils.clamp(player.x,-limit,limit);
      player.z = THREE.MathUtils.clamp(player.z,-limit,limit);
      player.bob += dt * 10;
    } else {
      player.bob += dt * 2;
    }

    const baseY = terrainHeight(player.x,player.z) + PLAYER_HEIGHT;
    const bob = moving ? Math.sin(player.bob) * .025 : 0;

    camera.position.set(player.x, baseY + bob, player.z);
    camera.rotation.set(player.pitch,player.yaw,0,"YXZ");

    // Subtle walking motion; small enough to feel natural instead of cartoonish.
    const walkSway = moving ? Math.sin(player.bob * .5) * .018 : 0;
    arm.position.y = -.34 + (moving ? Math.abs(Math.cos(player.bob)) * .014 : 0);
    arm.rotation.z = -.10 + walkSway;
    arm.rotation.x = -.08 + (moving ? Math.sin(player.bob) * .008 : 0);

    // Gentle day/night cycle.
    const phase = (elapsed * .018) % 1;
    const daylight = .5 + .5 * Math.sin(phase * Math.PI * 2 - Math.PI/2);
    const d = THREE.MathUtils.clamp(daylight,.08,1);

    sun.intensity = 1.0 + 2.7*d;
    hemi.intensity = .75 + .8*d;
    renderer.toneMappingExposure = .82 + .25*d;

    const night = daylight < .22;
    const evening = daylight < .5;
    timeEl.textContent = night ? "🌙 NIGHT" : evening ? "🌤️ EVENING" : "☀️ DAYLIGHT";
    scene.fog.density = night ? .007 : .011;

    if (innerWidth <= 600) {
      tipEl.textContent = moving ? "DRAG TO LOOK" : "JOYSTICK TO WALK • DRAG TO LOOK";
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), .05);
    elapsed += dt;
    update(dt);
    renderer.render(scene,camera);
  }

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, innerWidth <= 700 ? 1.12 : 1.45));
    renderer.setSize(innerWidth,innerHeight);
  });

  animate();
})();
</script>
</body>
</html>
