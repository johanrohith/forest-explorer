function noise(x,y){const s=Math.sin(x*12.9898+y*78.233)*43758.5453;return s-Math.floor(s)}

const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;

const trunkMat=new THREE.MeshStandardMaterial({color:0x4b3020,roughness:1}),barkDark=new THREE.MeshStandardMaterial({color:0x2d2118,roughness:1}),leafMats=[0x214d2c,0x2d6334,0x397844,0x1c4226].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.92,flatShading:true}));

const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.42,4.7,8),trunkMat);trunk.position.y=2.35;trunk.castShadow=true;g.add(trunk);

}
const trees=[];
for(let i=0;i<250;i++){let x,z;for(let tries=0;tries<20;tries++){x=(Math.random()-.5)*155;z=(Math.random()-.5)*155;if(Math.hypot(x,z)>13&&Math.random()>.10)break}const s=.72+Math.random()*1.18;trees.push(addTree(x,z,s,Math.floor(Math.random()*4)))}
const shrubMat=[0x356a3a,0x467b42,0x285a31].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true}));
for(let i=0;i<180;i++){const x=(Math.random()-.5)*155,z=(Math.random()-.5)*155;if(Math.hypot(x,z)<8)continue;const g=new THREE.Group();g.position.set(x,terrainHeight(x,z),z);for(let j=0;j<4;j++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.45+Math.random()*.35,1),shrubMat[j%3]);m.position.set((Math.random()-.5)*1.5,.35+Math.random()*.5,(Math.random()-.5)*1.5);m.scale.y=.7;m.castShadow=true;g.add(m)}scene.add(g)}
function grassTexture(){const c=document.createElement('canvas');c.width=128;c.height=128;const x=c.getContext('2d');x.clearRect(0,0,128,128);for(let i=0;i<35;i++){const px=64+(Math.random()-.5)*55;x.beginPath();x.moveTo(64,128);x.quadraticCurveTo(px,70,px+(Math.random()-.5)*16,15+Math.random()*35);x.lineTo(px+5,15+Math.random()*35);x.quadraticCurveTo(px+8,75,64,128);x.fillStyle=`rgba(${35+Math.random()*30},${75+Math.random()*80},${30+Math.random()*30},${.2+Math.random()*.55})`;x.fill()}return new THREE.CanvasTexture(c)}
const grassTex=grassTexture(),grassMat=new THREE.MeshStandardMaterial({map:grassTex,transparent:true,alphaTest:.18,side:THREE.DoubleSide,roughness:1,depthWrite:false});
for(let i=0;i<720;i++){const x=(Math.random()-.5)*165,z=(Math.random()-.5)*165;if(Math.hypot(x,z)<7)continue;const g=new THREE.Group();g.position.set(x,terrainHeight(x,z),z);g.rotation.y=Math.random()*Math.PI;const s=.45+Math.random()*.8;g.scale.set(s,s,s);for(let j=0;j<2;j++){const p=new THREE.Mesh(new THREE.PlaneGeometry(1.2,1.5),grassMat);p.rotation.y=j*Math.PI/2;p.position.y=.65;p.castShadow=false;g.add(p)}scene.add(g)}
const flowerColors=[0xffe5c2,0xff9aa6,0xffd85f,0xcbb4ff,0xffffff];
for(let i=0;i<220;i++){const x=(Math.random()-.5)*150,z=(Math.random()-.5)*150;if(Math.hypot(x,z)<8)continue;const g=new THREE.Group();g.position.set(x,terrainHeight(x,z),z);const stem=new THREE.Mesh(new THREE.CylinderGeometry(.012,.018,.42,5),new THREE.MeshStandardMaterial({color:0x2c6b35,roughness:1}));stem.position.y=.21;g.add(stem);const mat=new THREE.MeshStandardMaterial({color:flowerColors[i%flowerColors.length],roughness:.65,side:THREE.DoubleSide});for(let p=0;p<5;p++){const pet=new THREE.Mesh(new THREE.SphereGeometry(.065,7,5),mat),a=p/5*Math.PI*2;pet.scale.set(1,.45,1);pet.position.set(Math.cos(a)*.075,.47,Math.sin(a)*.075);g.add(pet)}const center=new THREE.Mesh(new THREE.SphereGeometry(.05,7,5),new THREE.MeshStandardMaterial({color:0xe4a72b,roughness:.7}));center.position.y=.47;g.add(center);scene.add(g)}
const rockMat=new THREE.MeshStandardMaterial({color:0x555e58,roughness:1,flatShading:true}),mossMat=new THREE.MeshStandardMaterial({color:0x526b4d,roughness:1,flatShading:true});
for(let i=0;i<120;i++){const x=(Math.random()-.5)*155,z=(Math.random()-.5)*155;if(Math.hypot(x,z)<9)continue;const g=new THREE.Group();g.position.set(x,terrainHeight(x,z),z);g.rotation.y=Math.random()*6.28;const m=new THREE.IcosahedronGeometry(.35+Math.random()*.75,1);const mesh=new THREE.Mesh(m,rockMat);mesh.scale.set(1.4,.75+Math.random()*.55,1);mesh.castShadow=true;mesh.receiveShadow=true;g.add(mesh);if(Math.random()<.5){const moss=new THREE.Mesh(new THREE.SphereGeometry(.35,8,5),mossMat);moss.scale.set(1.3,.22,1);moss.position.y=.35;g.add(moss)}scene.add(g)}
const mudMat=new THREE.MeshStandardMaterial({color:0x3b3027,transparent:true,opacity:.42,roughness:1,depthWrite:false});
for(let i=0;i<75;i++){const a=Math.random()*6.28,r=8+Math.random()*75,x=Math.cos(a)*r,z=Math.sin(a)*r;const p=new THREE.Mesh(new THREE.CircleGeometry(1.4+Math.random()*2.8,16),mudMat);p.rotation.x=-Math.PI/2;p.scale.y=.55;p.position.set(x,terrainHeight(x,z)+.012,z);scene.add(p)}
const cloudMat=new THREE.MeshLambertMaterial({color:0xf3f5ef,transparent:true,opacity:.20,depthWrite:false,fog:false});
for(let i=0;i<15;i++){const g=new THREE.Group(),a=Math.random()*6.28,r=55+Math.random()*80;g.position.set(Math.cos(a)*r,32+Math.random()*12,Math.sin(a)*r);g.rotation.y=Math.random()*6.28;for(let j=0;j<10;j++){const s=2.5+Math.random()*5,m=new THREE.Mesh(new THREE.SphereGeometry(s,12,8),cloudMat);m.position.set((Math.random()-.5)*14,(Math.random()-.5)*4,(Math.random()-.5)*6);m.scale.y=.55;m.scale.z=.75;g.add(m)}scene.add(g)}
const skin=new THREE.MeshStandardMaterial({color:0xc98761,roughness:.78,metalness:0}),skinHi=new THREE.MeshStandardMaterial({color:0xe0a17b,roughness:.75});
const hand=new THREE.Group();camera.add(hand);hand.position.set(.46,-.46,-.75);hand.rotation.set(.12,-.08,-.18);
const forearm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.72,6,10),skin);forearm.rotation.z=-.2;forearm.position.set(.1,-.06,.08);forearm.castShadow=true;hand.add(forearm);
const palm=new THREE.Mesh(new THREE.SphereGeometry(.19,12,10),skinHi);palm.scale.set(1.05,1.25,.65);palm.position.set(.03,.33,-.02);palm.castShadow=true;hand.add(palm);
for(let i=0;i<4;i++){const f=new THREE.Mesh(new THREE.CapsuleGeometry(.045,.20,5,8),skinHi);f.position.set(-.11+i*.075,.50,-.05);f.rotation.z=(i-1.5)*.12;f.castShadow=true;hand.add(f)}
const thumb=new THREE.Mesh(new THREE.CapsuleGeometry(.05,.24,5,8),skinHi);thumb.position.set(-.17,.32,-.03);thumb.rotation.z=-.75;thumb.rotation.y=.2;thumb.castShadow=true;hand.add(thumb);
const stick=new THREE.Group(),wood=new THREE.MeshStandardMaterial({color:0x6e4227,roughness:.92}),branch=new THREE.Mesh(new THREE.CylinderGeometry(.035,.06,1.5,8),wood);branch.rotation.z=-.18;branch.position.set(0,.7,0);branch.castShadow=true;stick.add(branch);const twig=new THREE.Mesh(new THREE.CylinderGeometry(.02,.035,.45,7),wood);twig.position.set(.13,1.22,0);twig.rotation.z=.65;stick.add(twig);stick.position.set(.48,-.55,-.78);stick.rotation.set(-.3,-.15,-.2);camera.add(stick);
const lantern=new THREE.Group();lantern.position.set(.50,-.40,-.88);lantern.rotation.set(.08,-.12,.05);camera.add(lantern);
const metal=new THREE.MeshStandardMaterial({color:0x242a27,metalness:.82,roughness:.28}),brass=new THREE.MeshStandardMaterial({color:0xb98a3b,metalness:.72,roughness:.3}),glass=new THREE.MeshPhysicalMaterial({color:0xffb84f,emissive:0xff7a19,emissiveIntensity:2.2,transparent:true,opacity:.62,roughness:.1,metalness:.05,transmission:.12});
const base=new THREE.Mesh(new THREE.CylinderGeometry(.13,.15,.07,16),metal);base.position.y=.04;lantern.add(base);const body=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.28,16),glass);body.position.y=.20;lantern.add(body);const top=new THREE.Mesh(new THREE.CylinderGeometry(.14,.11,.07,16),brass);top.position.y=.38;lantern.add(top);const cap=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.08,12),metal);cap.position.y=.45;lantern.add(cap);
for(let s=-1;s<=1;s+=2){const bar=new THREE.Mesh(new THREE.BoxGeometry(.025,.34,.025),brass);bar.position.set(s*.12,.22,0);lantern.add(bar)}
const handle=new THREE.Mesh(new THREE.TorusGeometry(.14,.018,7,18,Math.PI),brass);handle.rotation.x=Math.PI/2;handle.position.y=.45;lantern.add(handle);
const lampPoint=new THREE.PointLight(0xff9a3b,0,8,2);lampPoint.position.set(.50,.15,-.15);lantern.add(lampPoint);
const lampSpot=new THREE.SpotLight(0xffb45b,0,18,Math.PI/6,.55,1.2);lampSpot.position.set(.50,.20,-.15);lampSpot.target.position.set(.5,-.1,-5);lantern.add(lampSpot);lantern.add(lampSpot.target);
function setItem(name){hand.visible=name==='hand';stick.visible=name==='stick';lantern.visible=name==='lantern';if(name==='lantern'){lampPoint.intensity=16;lampSpot.intensity=55}else{lampPoint.intensity=0;lampSpot.intensity=0}}
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let joyId=null;
function setJoy(clientX,clientY){const r=joy.getBoundingClientRect();let dx=clientX-(r.left+r.width/2),dy=clientY-(r.top+r.height/2);const max=r.width*.37,len=Math.hypot(dx,dy);if(len>max){dx*=max/len;dy*=max/len}knob.style.transform=`translate3d(${dx}px,${dy}px,0)`;keys.x=dx/max;keys.y=dy/max}
joy.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();joyId=e.pointerId;try{joy.setPointerCapture(joyId)}catch(_){}setJoy(e.clientX,e.clientY)},{passive:false});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId){e.preventDefault();setJoy(e.clientX,e.clientY)}},{passive:false});
function joyUp(e){if(e.pointerId!==joyId)return;joyId=null;keys.x=keys.y=0;knob.style.transform='translate3d(0,0,0)'}
['pointerup','pointercancel','lostpointercapture'].forEach(t=>joy.addEventListener(t,joyUp));
let lookId=null,lastX=0,lastY=0;
function isJoystickArea(x,y){return x<250&&y>innerHeight-250}
function beginLook(x,y,id){if(isJoystickArea(x,y))return;lookId=id;lastX=x;lastY=y}
function moveLook(x,y,id){if(id!==lookId)return;const dx=x-lastX,dy=y-lastY;lastX=x;lastY=y;player.yaw-=dx*.005;player.pitch-=dy*.0035;player.pitch=THREE.MathUtils.clamp(player.pitch,-1.25,1.25)}
function endLook(id){if(id===lookId)lookId=null}
renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){e.preventDefault();beginLook(e.clientX,e.clientY,e.pointerId)}else beginLook(e.clientX,e.clientY,e.pointerId)},{passive:false});

const timeEl=document.getElementById('time');
function update(dt){
const forward=new THREE.Vector3(Math.sin(player.yaw),0,Math.cos(player.yaw)),right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw)),dir=new THREE.Vector3().addScaledVector(forward,-keys.y).addScaledVector(right,keys.x);
if(dir.lengthSq()>1)dir.normalize();
const speed=player.speed*(Math.abs(keys.y)+Math.abs(keys.x)>1?.72:1);
camera.position.addScaledVector(dir,speed*dt);camera.position.y=terrainHeight(camera.position.x,camera.position.z)+1.65;
player.bob+=dt*(dir.lengthSq()>0?10:2);const bob=dir.lengthSq()>0?Math.sin(player.bob)*.025:0;
camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;camera.position.y+=bob;
hand.rotation.z=-.18+Math.sin(player.bob)*.025;hand.position.y=-.46+Math.abs(Math.cos(player.bob))*.012;stick.rotation.z=-.2+Math.sin(player.bob)*.025;lantern.rotation.z=.05+Math.sin(player.bob)*.02;
const h=(elapsed*.012)%1,daylight=.5+.5*Math.sin(h*Math.PI*2-Math.PI/2),sunY=Math.max(.1,daylight);
sun.intensity=1.3+3.4*sunY;hemi.intensity=1+.7*sunY;renderer.toneMappingExposure=.88+.35*sunY;
const night=daylight<.22;timeEl.textContent=night?'🌙 NIGHT':daylight<.5?'🌤️ EVENING':'☀️ DAYLIGHT';scene.fog.density=night?.0065:.0105
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;update(dt);renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
animate();
})();
</script>
