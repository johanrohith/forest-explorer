const joy=el('joy'),knob=el('knob');let joyId=null;function setJoy(x,y){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy,max=r.width*.37,len=Math.hypot(dx,dy);if(len>max){dx*=max/len;dy*=max/len}knob.style.transform=`translate3d(${dx}px,${dy}px,0)`;keys.x=dx/max;keys.y=dy/max}joy.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();joyId=e.pointerId;try{joy.setPointerCapture(joyId)}catch(_){}setJoy(e.clientX,e.clientY)},{passive:false});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId){e.preventDefault();setJoy(e.clientX,e.clientY)}},{passive:false});function joyUp(e){if(e.pointerId!==joyId)return;joyId=null;keys.x=keys.y=0;knob.style.transform='translate3d(0,0,0)'}['pointerup','pointercancel','lostpointercapture'].forEach(t=>joy.addEventListener(t,joyUp));
let lookId=null,lastX=0,lastY=0;function isJoy(x,y){return x<250&&y>innerHeight-250}function beginLook(x,y,id){if(isJoy(x,y))return;lookId=id;lastX=x;lastY=y}function moveLook(x,y,id){if(id!==lookId)return;player.yaw-=(x-lastX)*.005;player.pitch=T.MathUtils.clamp(player.pitch-(y-lastY)*.0035,-1.25,1.25);lastX=x;lastY=y}function endLook(id){if(id===lookId)lookId=null}
renderer.domElement.addEventListener('pointerdown',e=>{e.preventDefault();beginLook(e.clientX,e.clientY,e.pointerId)},{passive:false});renderer.domElement.addEventListener('pointermove',e=>{e.preventDefault();moveLook(e.clientX,e.clientY,e.pointerId)},{passive:false});['pointerup','pointercancel','lostpointercapture'].forEach(t=>renderer.domElement.addEventListener(t,e=>endLook(e.pointerId)));
const timeEl=el('time');function update(dt){const f=new T.Vector3(Math.sin(player.yaw),0,Math.cos(player.yaw)),r=new T.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw)),dir=new T.Vector3().addScaledVector(f,-keys.y).addScaledVector(r,keys.x);if(dir.lengthSq()>1)dir.normalize();const speed=player.speed*(Math.abs(keys.y)+Math.abs(keys.x)>1?.72:1);camera.position.addScaledVector(dir,speed*dt);camera.position.y=terrainHeight(camera.position.x,camera.position.z)+1.65;player.bob+=dt*(dir.lengthSq()>0?10:2);const bob=dir.lengthSq()>0?Math.sin(player.bob)*.025:0;camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;camera.position.y+=bob;hand.rotation.z=-.18+Math.sin(player.bob)*.025;hand.position.y=-.46+Math.abs(Math.cos(player.bob))*.012;stick.rotation.z=-.2+Math.sin(player.bob)*.025;lantern.rotation.z=.05+Math.sin(player.bob)*.02;const h=elapsed*.012%1,daylight=.5+.5*Math.sin(h*Math.PI*2-Math.PI/2),sunY=Math.max(.1,daylight);sun.intensity=1.3+3.4*sunY;hemi.intensity=1+.7*sunY;renderer.toneMappingExposure=.88+.35*sunY;const night=daylight<.22;timeEl.textContent=night?'🌙 NIGHT':daylight<.5?'🌤️ EVENING':'☀️ DAYLIGHT';scene.fog.density=night?.0065:.0105}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;update(dt);renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate()})();</script></body></html>
