  <path d="M630 420 C670 373 688 341 720 321 C757 297 805 289 842 267 C877 246 896 226 925 204 L1020 204 C979 245 958 275 917 300 C875 326 822 343 797 374 C786 389 779 405 777 420 Z" fill="url(#trail)" opacity="0.8"/>
