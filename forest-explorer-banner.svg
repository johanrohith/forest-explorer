    <use href="#pineSlim" x="321" y="205" transform="translate(321 205) scale(0.88) translate(-321 -205)" color="#1a4532"/>
    <use href="#pine" x="1110" y="111" transform="translate(1110 111) scale(1.35) translate(-1110 -111)" color="#0c281f"/>
    <use href="#pine" x="1190" y="180" transform="translate(1190 180) scale(1.15) translate(-1190 -180)" color="#102f23"/>
    <use href="#pineSlim" x="1053" y="168" transform="translate(1053 168) scale(1.1) translate(-1053 -168)" color="#143a29"/>
