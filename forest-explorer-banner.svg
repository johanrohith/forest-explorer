      <path d="M-4 131 H4 V166 H-4 Z" fill="#593d2c"/>
    </g>
    <g id="pineSlim">
      <path d="M0 0 L-25 42 L-12 42 L-35 79 L-17 79 L-43 116 L43 116 L17 79 L35 79 L12 42 L25 42 Z" fill="currentColor"/>
      <path d="M-3 109 H3 V140 H-3 Z" fill="#4b3828"/>
    </g>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#sky)"/>
  <circle cx="914" cy="92" r="49" fill="#d3e7ca" opacity="0.1"/>
  <circle cx="914" cy="92" r="33" fill="#dcebd3" opacity="0.62"/>
