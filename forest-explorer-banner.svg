<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Forest Explorer</title>
  <desc id="desc">A stylized twilight forest with layered evergreen silhouettes, a winding trail, mist, and a glowing campfire.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#081b1a"/>
      <stop offset="0.52" stop-color="#12382c"/>
      <stop offset="1" stop-color="#244a37"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d8bc" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#b9d8bc" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#b9d8bc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b9a6c" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#c2a778" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="fireGlow">
      <stop offset="0" stop-color="#ffda86" stop-opacity="0.68"/>
      <stop offset="0.45" stop-color="#f28e43" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#f28e43" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f5e9"/>
      <stop offset="1" stop-color="#c9e5be"/>
    </linearGradient>
    <g id="pine">
