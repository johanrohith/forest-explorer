  <path d="M24 393 H1176" stroke="#d5e8ce" stroke-opacity="0.13"/>
  <text x="36" y="407" fill="#9db8a0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" letter-spacing="2.2">WANDER  ·  DISCOVER  ·  REMEMBER</text>
