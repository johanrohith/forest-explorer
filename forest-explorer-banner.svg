    <text x="28" y="24" fill="#a9dcb1" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="4">A FIRST-PERSON EXPLORATION GAME</text>
    <text x="24" y="91" fill="url(#titleFade)" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="57" font-weight="800" letter-spacing="1.2">FOREST</text>
